<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musik Player - TJKT 3</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="musik.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="cyber-bg"></div>

    <!-- NAVIGASI -->
    <nav>
        <div class="logo">TJKT 3</div>
        <div class="menu">
            <a href="../index.html"><i class="fas fa-home"></i> HOME</a>
            <a href="#" onclick="toggleTheme()" aria-label="Toggle Theme">
                <i class="fas fa-moon" id="theme-icon"></i>
            </a>
        </div>
    </nav>

    <!-- MUSIC PLAYER FULLSCREEN -->
    <div class="musik-container">
        <div class="musik-header reveal">
            <h1><i class="fas fa-music"></i> MUSIC PLAYER</h1>
            <p>TJKT 3 - TEKAJE MENDUNIA</p>
        </div>

        <!-- Now Playing -->
        <div class="now-playing reveal">
            <div class="album-art">
                <i class="fas fa-compact-disc spinning" id="discIcon"></i>
            </div>
            <div class="track-info">
                <h2 id="nowTitle">Pilih Lagu</h2>
                <p id="nowArtist">TJKT 3</p>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-section reveal">
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="time-info">
                <span id="currTime">0:00</span>
                <span id="durTime">0:00</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="player-controls reveal">
            <button onclick="prevTrack()" class="ctrl-btn"><i class="fas fa-backward"></i></button>
            <button onclick="playPauseTrack()" class="ctrl-btn play-btn"><i class="fas fa-play" id="playIcon"></i></button>
            <button onclick="nextTrack()" class="ctrl-btn"><i class="fas fa-forward"></i></button>
        </div>

        <!-- LIRIK SECTION -->
        <div class="lyrics-container reveal" id="lyricsContainer">
            <div class="lyrics-scroll" id="lyricsScroll">
                <p class="no-lyric">🎵 Pilih & putar lagu untuk melihat lirik 🎵</p>
            </div>
        </div>

        <!-- PLAYLIST -->
        <div class="playlist-section reveal">
            <h3><i class="fas fa-list"></i> PLAYLIST</h3>
            <div class="playlist-list" id="playlistList"></div>
        </div>

        <!-- BACK BUTTON -->
        <div class="back-home reveal">
            <a href="../index.html" class="btn-sosmed"><i class="fas fa-arrow-left"></i> Kembali ke Halaman Utama</a>
        </div>
    </div>

    <script src="musik.js"></script>
</body>
</html>
