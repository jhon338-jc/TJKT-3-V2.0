<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Admin Panel - TJKT 3</title>
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">
    <!-- LOGIN OVERLAY -->
    <div id="login-overlay">
        <div class="login-box">
            <div class="login-header">
                <div class="icon-container">
                    <i class="fas fa-crown"></i>
                </div>
                <h1>ADMIN ACCESS</h1>
                <p>Masukkan PIN untuk melanjutkan</p>
            </div>
            
            <div class="pin-input-container">
                <div class="pin-display">
                    <input type="password" id="pinInput" maxlength="6" placeholder="••••••" autofocus>
                </div>
                <div class="pin-keypad">
                    <button onclick="addPin('1')">1</button>
                    <button onclick="addPin('2')">2</button>
                    <button onclick="addPin('3')">3</button>
                    <button onclick="addPin('4')">4</button>
                    <button onclick="addPin('5')">5</button>
                    <button onclick="addPin('6')">6</button>
                    <button onclick="addPin('7')">7</button>
                    <button onclick="addPin('8')">8</button>
                    <button onclick="addPin('9')">9</button>
                    <button onclick="clearPin()" class="clear-btn">C</button>
                    <button onclick="addPin('0')">0</button>
                    <button onclick="submitPin()" class="enter-btn">→</button>
                </div>
            </div>
            
            <div id="login-error" class="error-message"></div>
            
            <div class="loading-bar-login" id="loadingBarLogin">
                <div class="loading-progress-login"></div>
            </div>
        </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="admin-dashboard" style="display: none;">
        <!-- SIDEBAR -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i class="fas fa-crown"></i>
                    <span>TJKT 3</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="#dashboard" class="active" data-section="dashboard">
                    <i class="fas fa-th-large"></i> Dashboard
                </a>
                <a href="#siswa" data-section="siswa">
                    <i class="fas fa-users"></i> Siswa
                </a>
                <a href="#struktur" data-section="struktur">
                    <i class="fas fa-sitemap"></i> Struktur
                </a>
                <a href="#musik" data-section="musik">
                    <i class="fas fa-music"></i> Musik
                </a>
                <a href="#galeri" data-section="galeri">
                    <i class="fas fa-images"></i> Galeri
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="../index.html" class="sidebar-home-btn">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="#" onclick="logout()" class="sidebar-logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="admin-main">
            <header class="admin-topbar">
                <h1 id="pageTitle">📊 Dashboard</h1>
                <div class="topbar-actions">
                    <button class="admin-btn" onclick="exportData()"><i class="fas fa-download"></i> Export</button>
                    <button class="admin-btn" onclick="resetAllData()" style="background:#ff4757;"><i class="fas fa-redo"></i> Reset</button>
                </div>
            </header>

            <div class="admin-content">
                <section id="dashboard" class="admin-section active-section">
                    <!-- Render statistik -->
                </section>
                <section id="siswa" class="admin-section">
                    <!-- Render dari JS -->
                </section>
                <section id="struktur" class="admin-section">
                    <!-- Render dari JS -->
                </section>
                <section id="musik" class="admin-section">
                    <!-- Render dari JS -->
                </section>
                <section id="galeri" class="admin-section">
                    <!-- Render dari JS -->
                </section>
            </div>
        </main>
    </div>

    <script src="../js/data.js"></script>
    <script src="admin.js"></script>
</body>
</html>
